<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-d2-version="v0.7.1" preserveAspectRatio="xMinYMin meet" viewBox="0 0 444 2789">
  <defs>
    <marker id="mk-arrow" markerWidth="8" markerHeight="10" refX="6" refY="5" viewBox="0 0 8 10" orient="auto">
      <polygon points="0 1, 7 5, 0 9" fill="#456090"/>
    </marker>
    <marker id="mk-arrow-rust" markerWidth="8" markerHeight="10" refX="6" refY="5" viewBox="0 0 8 10" orient="auto">
      <polygon points="0 1, 7 5, 0 9" fill="#FFA032"/>
    </marker>
    <mask id="mask-val" maskUnits="userSpaceOnUse" x="-21" y="-1" width="444" height="2789">
      <rect x="-21" y="-1" width="444" height="2789" fill="white"/>
      <rect x="110" y="1506" width="182" height="26" fill="black"/>
    </mask>
  </defs>

  <style type="text/css"><![CDATA[
    text, tspan { stroke: none !important; stroke-width: 0 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", Arial, sans-serif; }
    .title-h1 { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .title-rust { font-size: 21px; font-weight: 700; fill: #FFA032; }
    .card-title { font-size: 15.5px; font-weight: 700; fill: #FFFFFF; }
    .card-title-rust { font-size: 15.5px; font-weight: 700; fill: #FFA032; }
    .card-title-success { font-size: 15.5px; font-weight: 700; fill: #34D399; }
    .card-sub { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .card-sub-cyan { font-size: 13px; font-weight: 600; fill: #64C8FF; }
    .card-sub-rust { font-size: 13px; font-weight: 500; fill: #FFD7A8; }
    .card-sub-success { font-size: 13px; font-weight: 600; fill: #D1FAE5; }
    .val-text { font-size: 14.5px; font-style: italic; font-weight: 600; fill: #FFA032; }
    .conn { stroke-linecap: round; stroke-linejoin: round; }
  ]]></style>

  <svg class="d2-svg" width="444" height="2789" viewBox="-21 -1 444 2789">
    <rect x="-21" y="-1" width="444" height="2789" rx="0" fill="transparent" stroke-width="0" />

    <!-- ================= CONTENEDOR 1: FRONTEND & MIDDLE-END ================= -->
    <g class="fila_1">
      <rect x="0" y="20" width="402" height="1414" rx="8" stroke="#253852" fill="#0E1420" stroke-width="1.5" />
    </g>

    <!-- ================= CONTENEDOR 2: BACKEND & LINKER ================= -->
    <g class="fila_2">
      <rect x="46" y="1624" width="310" height="1143" rx="8" stroke="#253852" fill="#0E1420" stroke-width="1.5" />
    </g>

    <!-- 1. CÓDIGO FUENTE -->
    <g class="origen">
      <rect x="128" y="50" width="147" height="82" rx="6" stroke="#64C8FF" fill="#142032" stroke-width="1.5" />
      <text x="201.5" y="88.5" text-anchor="middle" class="card-title">
        <tspan x="201.5" dy="0">Código Fuente</tspan>
        <tspan x="201.5" dy="18.5" class="card-sub-cyan">[.rs]</tspan>
      </text>
    </g>

    <!-- 2. FRONTEND (rustc) -->
    <g class="frontend">
      <rect x="74" y="252" width="255" height="688" rx="6" stroke="#2B3F5C" fill="#121A28" stroke-width="1.5" />
      <text x="201.5" y="240" text-anchor="middle" class="title-h1">Frontend (rustc)</text>
      
      <!-- Lexer + Parser -->
      <g class="lexer">
        <rect x="118" y="282" width="166" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
        <text x="201" y="320.5" text-anchor="middle" class="card-title">
          <tspan x="201" dy="0">Lexer + Parser</tspan>
          <tspan x="201" dy="18.5" class="card-sub">Tokens y sintaxis</tspan>
        </text>
      </g>

      <!-- AST -->
      <g class="ast">
        <rect x="122" y="464" width="158" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
        <text x="201" y="502.5" text-anchor="middle" class="card-title">
          <tspan x="201" dy="0">AST</tspan>
          <tspan x="201" dy="18.5" class="card-sub">Árbol sintáctico</tspan>
        </text>
      </g>

      <!-- Macros -->
      <g class="macros">
        <rect x="104" y="646" width="195" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
        <text x="201.5" y="684.5" text-anchor="middle" class="card-title">
          <tspan x="201.5" dy="0">Expansión de macros</tspan>
          <tspan x="201.5" dy="18.5" class="card-sub-cyan">macro_rules! / derive</tspan>
        </text>
      </g>

      <!-- HIR -->
      <g class="hir">
        <rect x="121" y="828" width="161" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
        <text x="201.5" y="866.5" text-anchor="middle" class="card-title">
          <tspan x="201.5" dy="0">HIR</tspan>
          <tspan x="201.5" dy="18.5" class="card-sub">Tipos y nombres</tspan>
        </text>
      </g>
    </g>

    <!-- 3. MIDDLE-END (Rust Ownership & Borrow Checker) -->
    <g class="middle">
      <rect x="30" y="1080" width="342" height="324" rx="6" stroke="#7A3D12" fill="#1A1513" stroke-width="1.5" />
      <text x="201" y="1068" text-anchor="middle" class="title-rust">Middle-End</text>
      
      <!-- MIR -->
      <g class="mir">
        <rect x="83" y="1110" width="237" height="82" rx="5" stroke="#B85D1E" fill="#251913" stroke-width="1.2" />
        <text x="201.5" y="1148.5" text-anchor="middle" class="card-title">
          <tspan x="201.5" dy="0">MIR</tspan>
          <tspan x="201.5" dy="18.5" class="card-sub-rust">Representación intermedia</tspan>
        </text>
      </g>

      <!-- Borrow Checker -->
      <g class="borrow">
        <rect x="60" y="1292" width="282" height="82" rx="5" stroke="#FFA032" fill="#301E13" stroke-width="1.5" />
        <text x="201" y="1330.5" text-anchor="middle" class="card-title-rust">
          <tspan x="201" dy="0">Borrow Checker</tspan>
          <tspan x="201" dy="18.5" class="card-sub-rust">Ownership, borrowing y lifetimes</tspan>
        </text>
      </g>
    </g>

    <!-- 4. BACKEND (LLVM) -->
    <g class="llvm">
      <rect x="76" y="1665" width="250" height="324" rx="6" stroke="#2B3F5C" fill="#121A28" stroke-width="1.5" />
      <text x="201" y="1653" text-anchor="middle" class="title-h1">Backend (LLVM)</text>
      
      <!-- LLVM IR -->
      <g class="ir">
        <rect x="150" y="1695" width="102" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
        <text x="201" y="1733.5" text-anchor="middle" class="card-title">
          <tspan x="201" dy="0">LLVM IR</tspan>
          <tspan x="201" dy="18.5" class="card-sub-cyan">[.ll / .bc]</tspan>
        </text>
      </g>

      <!-- Optimizaciones -->
      <g class="optimize">
        <rect x="106" y="1877" width="190" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
        <text x="201" y="1915.5" text-anchor="middle" class="card-title">
          <tspan x="201" dy="0">Optimizaciones</tspan>
          <tspan x="201" dy="18.5" class="card-sub">opt-level = 0 / 3 / s / z</tspan>
        </text>
      </g>
    </g>

    <!-- 5. ENSAMBLADOR -->
    <g class="asm">
      <rect x="132" y="2109" width="139" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
      <text x="201.5" y="2147.5" text-anchor="middle" class="card-title">
        <tspan x="201.5" dy="0">Ensamblador</tspan>
        <tspan x="201.5" dy="18.5" class="card-sub-cyan">[.s / .asm]</tspan>
      </text>
    </g>

    <!-- 6. CÓDIGO OBJETO -->
    <g class="objeto">
      <rect x="128" y="2291" width="146" height="82" rx="5" stroke="#314B6E" fill="#162235" stroke-width="1.2" />
      <text x="201" y="2329.5" text-anchor="middle" class="card-title">
        <tspan x="201" dy="0">Código Objeto</tspan>
        <tspan x="201" dy="18.5" class="card-sub-cyan">[.o]</tspan>
      </text>
    </g>

    <!-- 7. LINKER -->
    <g class="linker">
      <rect x="124" y="2473" width="155" height="82" rx="5" stroke="#255566" fill="#13232C" stroke-width="1.2" />
      <text x="201.5" y="2511.5" text-anchor="middle" class="card-title">
        <tspan x="201.5" dy="0">Linker (ld / lld)</tspan>
        <tspan x="201.5" dy="18.5" class="card-sub-cyan">+ libstd / Crates</tspan>
      </text>
    </g>

    <!-- 8. ARTEFACTO FINAL -->
    <g class="binario">
      <rect x="85" y="2655" width="233" height="82" rx="6" stroke="#10B981" fill="#0D2E22" stroke-width="1.5" />
      <text x="201.5" y="2693.5" text-anchor="middle" class="card-title-success">
        <tspan x="201.5" dy="0">ARTEFACTO FINAL</tspan>
        <tspan x="201.5" dy="18.5" class="card-sub-success">[ELF / PE / Mach-O / WASM]</tspan>
      </text>
    </g>

    <!-- ================= CONECTORES & FLECHAS ================= -->
    <!-- Origen -> Frontend -->
    <path d="M 201 134 C 201 172 201 188.8 201 212" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- Lexer -> AST -->
    <path d="M 201 366 C 201 404 201 424 201 460" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- AST -> Macros -->
    <path d="M 201 548 C 201 586 201 606 201 642" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- Macros -> HIR -->
    <path d="M 201 730 C 201 768 201 788 201 824" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- Frontend -> Middle -->
    <path d="M 201 942 C 201 996 201 1016.8 201 1040" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- MIR -> Borrow Checker -->
    <path d="M 201 1194 C 201 1232 201 1252 201 1288" stroke="#FFA032" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow-rust)" />

    <!-- Middle-End -> LLVM (Validaciones superadas) -->
    <path d="M 201 1406 C 201 1460 201 1486.1 201 1504.25 C 201 1522.4 201 1601.8 201 1625" stroke="#FFA032" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow-rust)" mask="url(#mask-val)" />
    <text x="201.5" y="1522" text-anchor="middle" class="val-text">Validaciones superadas</text>

    <!-- IR -> Optimize -->
    <path d="M 201 1779 C 201 1817 201 1837 201 1873" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- LLVM -> Asm -->
    <path d="M 201 1991 C 201 2045 201 2069 201 2105" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- Asm -> Objeto -->
    <path d="M 201 2193 C 201 2231 201 2251 201 2287" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- Objeto -> Linker -->
    <path d="M 201 2375 C 201 2413 201 2433 201 2469" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />

    <!-- Linker -> Binario -->
    <path d="M 201 2557 C 201 2595 201 2615 201 2651" stroke="#456090" fill="none" class="conn" stroke-width="2" marker-end="url(#mk-arrow)" />
  </svg>
</svg>
