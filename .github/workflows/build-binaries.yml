name: Build binaries

on:
  push:
    tags: ["v*"]      # al subir un tag como v0.1.0 se crea un Release con los binarios

permissions:
  contents: write

env:
  BIN_NAME: ferriskey  # debe coincidir con [package] name en Cargo.toml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias de Linux (egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxcb1-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig1-dev libgl1-mesa-dev \
            libxkbcommon-dev libwayland-dev

      - name: Compilar (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empaquetar (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} dist/
          tar -czf ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz -C dist ${{ env.BIN_NAME }}

      - name: Empaquetar (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe `
            -DestinationPath ${{ env.BIN_NAME }}-${{ matrix.target }}.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true